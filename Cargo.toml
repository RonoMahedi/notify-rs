[workspace]
resolver = "2"
members = ["crates/common", "crates/api", "crates/worker", "crates/loadgen", "crates/campaign"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
rdkafka = { version = "0.38", features = ["tokio"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
futures = "0.3"
governor = "0.10"
async-trait = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
common = { path = "crates/common" }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
# sqlx row tuples like Option<(Uuid, String, Option<String>, ...)> trip this; aliases wouldn't add clarity.
type_complexity = "allow"
