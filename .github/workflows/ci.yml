name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # librdkafka is compiled from source by rdkafka-sys; ubuntu-latest already has a
      # C toolchain, cmake and zlib headers, so nothing extra to install.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --locked

  docker:
    name: docker image · compose config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      # Builds the same image the compose stack runs (api, worker, loadgen, campaign).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: notify:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
